  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Gallery image preview">

  <script>
    function scrollRow(btn, direction) {
      const track = btn.closest('.scroll-row')
                       .querySelector('.scroll-row-track');
      const cardWidth = track.querySelector('.scroll-card').offsetWidth + 14;
      track.scrollBy({ left: direction * cardWidth * 2, behavior: 'smooth' });
    }

    (function () {
      const filterButtons = Array.from(document.querySelectorAll(".filter-btn"));
      const cards = Array.from(document.querySelectorAll(".masonry-gallery .gallery-card"));
      const lightbox = document.getElementById("lightbox");
      const lightboxImage = document.getElementById("lightbox-image");
      const closeButton = lightbox.querySelector(".lightbox-close");
      const prevButton = lightbox.querySelector(".lightbox-prev");
      const nextButton = lightbox.querySelector(".lightbox-next");
      let visibleCards = cards;
      let currentIndex = 0;

      const updateVisibleCards = () => {
        visibleCards = cards.filter((card) => !card.classList.contains("is-hidden"));
      };

      const applyFilter = (filter) => {
        cards.forEach((card) => {
          const shouldShow = filter === "all" || card.dataset.category === filter;

          if (shouldShow) {
            card.hidden = false;
            requestAnimationFrame(() => {
              card.classList.remove("is-hidden");
              card.setAttribute("aria-hidden", "false");
            });
            return;
          }

          card.classList.add("is-hidden");
          card.setAttribute("aria-hidden", "true");
          window.setTimeout(() => {
            if (card.classList.contains("is-hidden")) {
              card.hidden = true;
            }
          }, 230);
        });
        updateVisibleCards();
      };

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          filterButtons.forEach((item) => item.classList.remove("is-active"));
          button.classList.add("is-active");
          applyFilter(button.dataset.filter);
        });
      });

      const showImage = (index) => {
        if (!visibleCards.length) {
          return;
        }

        currentIndex = (index + visibleCards.length) % visibleCards.length;
        const image = visibleCards[currentIndex].querySelector("img");
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
      };

      const openLightbox = (card) => {
        updateVisibleCards();
        currentIndex = visibleCards.indexOf(card);
        showImage(currentIndex);
        lightbox.classList.add("is-open");
        document.body.style.overflow = "hidden";
      };

      const closeLightbox = () => {
        lightbox.classList.remove("is-open");
        document.body.style.overflow = "";
      };

      cards.forEach((card) => {
        card.addEventListener("click", () => {
          if (!card.classList.contains("is-hidden")) {
            openLightbox(card);
          }
        });
      });

      closeButton.addEventListener("click", closeLightbox);
      prevButton.addEventListener("click", () => showImage(currentIndex - 1));
      nextButton.addEventListener("click", () => showImage(currentIndex + 1));

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (!lightbox.classList.contains("is-open")) {
          return;
        }

        if (event.key === "Escape") {
          closeLightbox();
        }

        if (event.key === "ArrowLeft") {
          showImage(currentIndex - 1);
        }

        if (event.key === "ArrowRight") {
          showImage(currentIndex + 1);
        }
      });

      // Lazy-load opacity effect
      document.querySelectorAll('img').forEach(function(img) {
        img.addEventListener('load', function() { img.classList.add('loaded'); });
        if (img.complete) img.classList.add('loaded');
      });
    })();
  </script>
